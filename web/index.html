<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>WebFileServer</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <div class="page">
        <header class="header">
            <div>
                <h1>WebFileServer</h1>
                <p>基于 C++ / SQLite / HTTP 的轻量级文件管理系统</p>
            </div>
            <button id="logoutBtn" onclick="logout()">退出登录</button>
        </header>

        <section id="registerSection" class="card">
            <h2>用户注册</h2>
            <div class="form-row">
                <input id="registerUsername" placeholder="用户名" />
                <input id="registerPassword" type="password" placeholder="密码" />
                <button onclick="registerUser()">注册</button>
            </div>
        </section>

        <section id="loginSection" class="card">
            <h2>用户登录</h2>
            <div class="form-row">
                <input id="loginUsername" placeholder="用户名" />
                <input id="loginPassword" type="password" placeholder="密码" />
                <button onclick="loginUser()">登录</button>
                <button onclick="checkToken()">验证 Token</button>
            </div>
            <p class="token-text">当前 Token：<span id="tokenText">未登录</span></p>
        </section>

        <section id="uploadSection" class="card">
            <h2>文件上传</h2>

            <p class="hint">
                单个文件最大支持 100 MB。选择文件后可查看文件大小。
            </p>

            <div class="form-row">
                <input id="fileInput" type="file" />
                <button onclick="uploadFile()">上传文件</button>
                <button onclick="loadFileList()">刷新文件列表</button>
            </div>

            <p id="selectedFileInfo" class="file-selected-info">未选择文件</p>

            <div id="uploadProgressWrapper" class="progress-wrapper hidden">
                <div id="uploadProgressBar" class="progress-bar">0%</div>
            </div>
        </section>

        <section id="fileSection" class="card">
            <h2>文件列表</h2>
            <div id="fileList" class="file-list">
                暂无文件
            </div>
        </section>

        <section id="shareSection" class="card">
            <h2>我的分享</h2>
            <div class="form-row">
                <button onclick="loadShareList()">刷新分享列表</button>
            </div>

            <div id="shareList" class="share-list">
                暂无分享
            </div>
        </section>

        <section id="logSection" class="card">
            <h2>操作日志</h2>
            <pre id="logBox"></pre>
        </section>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
